[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Give the CDC device a recognizable product string. The board keeps the
; Waveshare / Arduino-Pico VID/PID from its board definition.
board_build.arduino.earlephilhower.usb_manufacturer = LayoutBeep
board_build.arduino.earlephilhower.usb_product = LayoutBeep RP2040-Zero

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.4
