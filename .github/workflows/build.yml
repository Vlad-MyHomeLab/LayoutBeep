name: Сборка

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-check:
    name: Проверка перед сборкой
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Проверить файлы репозитория
        run: python3 scripts/check_public.py

      - name: Проверить правило INI
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'WritePrivateProfileStringW' windows; then
            echo 'Запрещено: найден WritePrivateProfileStringW'
            exit 1
          fi
          test ! -e windows/LayoutBeep.ini

  windows:
    name: Сборка LayoutBeep.exe
    needs: privacy-check
    runs-on: windows-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Собрать EXE через MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cd windows
          call build_msvc.bat
          if errorlevel 1 exit /b 1
          dumpbin /headers LayoutBeep.exe | findstr /i "machine x64"
          dumpbin /imports LayoutBeep.exe > imports.txt
          findstr /C:"GDI32.dll" imports.txt
          if exist LayoutBeep.ini exit /b 1

      - name: Сохранить LayoutBeep.exe
        uses: actions/upload-artifact@v4
        with:
          name: LayoutBeep-Windows-x64
          path: windows/LayoutBeep.exe
          if-no-files-found: error

  firmware:
    name: Сборка firmware.uf2
    needs: privacy-check
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Кэшировать PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Установить PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Собрать прошивку
        run: pio run -d firmware

      - name: Сохранить firmware.uf2
        uses: actions/upload-artifact@v4
        with:
          name: LayoutBeep-RP2040-Zero
          path: firmware/.pio/build/waveshare_rp2040_zero/firmware.uf2
          if-no-files-found: error

  release:
    name: Публикация релиза
    needs: [windows, firmware]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Определить необходимость релиза
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ ! -f VERSION ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Некорректный VERSION: $VERSION"
            exit 1
          fi

          PUBLISH=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUBLISH=true
          elif [[ "$COMMIT_MESSAGE" == *"[релиз]"* ]]; then
            PUBLISH=true
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              PUBLISH=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- VERSION; then
              PUBLISH=true
            fi
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Скачать LayoutBeep.exe
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: LayoutBeep-Windows-x64
          path: release/windows

      - name: Скачать firmware.uf2
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: LayoutBeep-RP2040-Zero
          path: release/firmware

      - name: Подготовить файлы релиза
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          cp release/windows/LayoutBeep.exe release/LayoutBeep.exe
          cp release/firmware/firmware.uf2 release/LayoutBeep-RP2040-Zero.uf2
          cd release
          sha256sum LayoutBeep.exe LayoutBeep-RP2040-Zero.uf2 > SHA256SUMS.txt

      - name: Опубликовать GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/LayoutBeep.exe \
              release/LayoutBeep-RP2040-Zero.uf2 \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              release/LayoutBeep.exe \
              release/LayoutBeep-RP2040-Zero.uf2 \
              release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "LayoutBeep v${VERSION}" \
              --generate-notes
          fi
