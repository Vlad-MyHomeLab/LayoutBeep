name: Сборка

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-check:
    name: Проверка перед сборкой
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Проверить файлы репозитория
        run: python3 scripts/check_public.py

      - name: Проверить правило INI
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'WritePrivateProfileStringW' windows; then
            echo 'Запрещено: найден WritePrivateProfileStringW'
            exit 1
          fi
          test ! -e windows/LayoutBeep.ini

  windows:
    name: Сборка LayoutBeep.exe
    needs: privacy-check
    runs-on: windows-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Собрать EXE через MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cd windows
          call build_msvc.bat
          if errorlevel 1 exit /b 1
          dumpbin /headers LayoutBeep.exe | findstr /i "machine x64"
          dumpbin /imports LayoutBeep.exe > imports.txt
          findstr /C:"GDI32.dll" imports.txt
          if exist LayoutBeep.ini exit /b 1

      - name: Сохранить LayoutBeep.exe
        uses: actions/upload-artifact@v4
        with:
          name: LayoutBeep-Windows-x64
          path: windows/LayoutBeep.exe
          if-no-files-found: error

  firmware:
    name: Сборка firmware.uf2
    needs: privacy-check
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Кэшировать PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Установить PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Собрать прошивку
        run: pio run -d firmware

      - name: Сохранить firmware.uf2
        uses: actions/upload-artifact@v4
        with:
          name: LayoutBeep-RP2040-Zero
          path: firmware/.pio/build/waveshare_rp2040_zero/firmware.uf2
          if-no-files-found: error
